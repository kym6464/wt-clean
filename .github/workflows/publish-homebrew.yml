name: Publish to Homebrew

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  homebrew-releaser:
    runs-on: ubuntu-latest
    name: homebrew-releaser
    steps:
      - name: Release project to Homebrew tap
        uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: kym6464
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_PAT }}
          version: ${{ github.event.release.tag_name }}
          install: 'bin.install "wt-clean"'
          depends_on: |-
            "worktrunk"
          target_darwin_arm64: true
          # Runs at login and daily at 10am; launchd runs a missed 10am tick on wake.
          formula_includes: |
            service do
              run opt_bin/"wt-clean"
              run_type :cron
              cron "0 10 * * *"
              environment_variables PATH: std_service_path_env
              log_path var/"log/wt-clean.log"
              error_log_path var/"log/wt-clean.log"
            end
